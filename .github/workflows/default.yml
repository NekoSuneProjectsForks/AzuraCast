name: Build, Test and Publish
on:
  pull_request:
    branches:
      - main
      - modern
  push:
    paths-ignore:
      - '*.md'
      - '.github/*.yml'
      - '.github/ISSUE_TEMPLATE/*.md'
      - 'install.sh' # Ansible-only scripts and folders
      - 'update.sh'
      - 'util/ansible/**'
    branches:
      - main
      - modern
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without using cached Docker layers'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-test:
    name: PHP Test Suite
    runs-on: ubuntu-latest
    env:
      APPLICATION_ENV: testing
    steps:
      - uses: actions/checkout@master

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, xdebug
          tools: composer:v2, cs2pr

      - name: Cache PHP dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.OS }}-build-${{ hashFiles('composer.lock') }}

      - name: Run Composer install
        run: |
          composer install --no-interaction --ignore-platform-reqs

      - name: Run PHP Linter
        run: |
          vendor/bin/parallel-lint . --exclude vendor --checkstyle | cs2pr

      - name: Build Codeception actors
        run: |
          vendor/bin/codecept build

      - name: Run PHPStan
        run: |
          vendor/bin/phpstan analyze --memory-limit=-1 --error-format=checkstyle | cs2pr

      - name: Run PHP Code Sniffer
        run: |
          vendor/bin/phpcs --report=checkstyle | cs2pr

      - name: Run Unit Tests
        run: |
          vendor/bin/codecept run Unit --no-interaction

      - name: Check Added DB Migrations
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          php backend/bin/console azuracast:dev:check-migrations "$BASE_SHA"

  node-test:
    name: Node Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/jod"
          cache: "npm"

      - run: npm ci --include=dev

      - name: Lint and check styling
        run: npm run ci

      - name: Check TypeScript types
        run: npm run tsc

  prepare:
    name: Prepare Codebase
    needs:
      - php-test
      - node-test
    runs-on: ubuntu-latest
    env:
      APPLICATION_ENV: testing
      NODE_ENV: production
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modern')
    steps:
      - uses: actions/checkout@master

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, xdebug
          tools: composer:v2, cs2pr

      - name: Cache PHP dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.OS }}-build-${{ hashFiles('composer.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/jod"
          cache: "npm"

      - name: Set console permissions and clear static assets.
        run: |
          rm -rf web/static/vite_dist
          rm -rf translations/*.UTF-8
          chmod a+x backend/bin/*

      - name: Run Composer install
        run: |
          composer install --no-interaction --ignore-platform-reqs

      - name: Generate new translations from existing code.
        run: |
          npm ci --include=dev
          backend/bin/console locale:generate

      - name: Use repository translations
        run: |
          echo "Using translations committed to the maintained fork; no upstream Crowdin secrets are required."

      - name: Import locales, build static assets.
        run: |
          backend/bin/console locale:import
          npm run build

      - name: Build OpenAPI Docs
        run: backend/bin/console azuracast:api:docs

      - name: Write .gitinfo File
        run: |
          bash util/write_git_info.sh
          chmod 777 .gitinfo

      - name: Upload built static assets and translations
        uses: actions/upload-artifact@v7
        with:
          name: assets
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .gitinfo
            translations
            web/static/vite_dist
            web/static/api/openapi.yml

  build:
    name: Build & Publish
    needs: prepare
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modern')
    steps:
      - uses: actions/checkout@master

      - name: Download built static assets from previous step
        uses: actions/download-artifact@v8
        with:
          name: assets

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/nekosuneprojectsforks/azuracast
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=modern,enable=${{ github.ref == 'refs/heads/modern' }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and publish fork image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
